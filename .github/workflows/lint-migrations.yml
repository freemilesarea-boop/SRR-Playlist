name: Lint · Migrations

# PR 및 default branch push 시 Supabase migration 파일의
# duplicate prefix + unsafe array-concat 회귀를 차단.
#
# 검사 대상: supabase/migrations/*.sql
# 정책 정의: docs/migrations.md + docs/MIGRATION_RULES.md
# 스크립트:  scripts/lint-migrations.mjs
# allowlist: LEGACY_PREFIX_ALLOWLIST = {'0068','0214','0388'} — 이미 prod 반영, rename 금지
#
# 위반 시 PR check 실패 — 머지 차단.
# 신규 migration 은 최신 prefix + 1 을, 같은 도메인 나눔은 suffix (0395a, 0395b) 사용.

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'scripts/lint-migrations.mjs'
      - 'package.json'
      - '.github/workflows/lint-migrations.yml'
  push:
    branches:
      - claude/playlist-mvp-development-2JmTJ
    paths:
      - 'supabase/migrations/**'
      - 'scripts/lint-migrations.mjs'

jobs:
  lint-migrations:
    name: Lint migrations (duplicate-prefix + array-concat)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # package.json + scripts/ 만 필요 — 별도 cache 안 함 (npm install skip).
          # 스크립트는 의존성 없는 순수 Node (readdirSync/readFileSync) 라 npm ci 불필요.

      - name: Run lint:migrations
        run: |
          node --version
          npm run lint:migrations
