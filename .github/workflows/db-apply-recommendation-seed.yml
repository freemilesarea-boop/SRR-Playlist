name: DB · 추천 메타데이터 시드 적용

# 수동 실행 전용. Actions 탭 → "Run workflow" 클릭.
#
# 시크릿 등록 방법 두 가지 — 둘 중 하나만 등록하면 됩니다.
#
# [방법 A · 권장] 개별 시크릿 (URL 파싱 문제 0)
#   Repo Settings → Secrets and variables → Actions → New repository secret
#   - SUPABASE_DB_HOST       예) aws-0-ap-southeast-1.pooler.supabase.com
#   - SUPABASE_DB_USER       예) postgres.nsoesrvwkxqifjcxzvol
#   - SUPABASE_DB_PASSWORD   DB 비밀번호 (날것, 인코딩 X, 특수문자 OK)
#   - (선택) SUPABASE_DB_PORT  기본 5432
#   - (선택) SUPABASE_DB_NAME  기본 postgres
#
# [방법 B] 단일 URL 시크릿
#   - SUPABASE_DB_URL  Supabase Connect 모달 → "Session pooler" 탭의 URI 통째.
#                      비밀번호의 @ : / ? # % 등 특수문자는 URL-encode 필요.
on:
  workflow_dispatch:

jobs:
  apply-seed:
    runs-on: ubuntu-latest
    env:
      PGHOST: ${{ secrets.SUPABASE_DB_HOST }}
      PGUSER: ${{ secrets.SUPABASE_DB_USER }}
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PGPORT: ${{ secrets.SUPABASE_DB_PORT }}
      PGDATABASE: ${{ secrets.SUPABASE_DB_NAME }}
      PGSSLMODE: require
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install psql
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client

      - name: Resolve connection mode
        run: |
          if [ -n "$PGHOST" ] && [ -n "$PGUSER" ] && [ -n "$PGPASSWORD" ]; then
            echo "✅ MODE: 개별 시크릿 (권장)"
            echo "   host: $PGHOST"
            echo "   user: $PGUSER"
            echo "   port: ${PGPORT:-5432}"
            echo "   db:   ${PGDATABASE:-postgres}"
            {
              echo "PGPORT=${PGPORT:-5432}"
              echo "PGDATABASE=${PGDATABASE:-postgres}"
              echo "PSQL_CONN="
            } >> "$GITHUB_ENV"
          elif [ -n "$SUPABASE_DB_URL" ]; then
            echo "✅ MODE: URL 시크릿"
            MASKED=$(printf '%s' "$SUPABASE_DB_URL" | sed -E 's#(://[^:]+:)[^@]+@#\1***@#')
            echo "   url (masked): $MASKED"
            {
              echo "PSQL_CONN=$SUPABASE_DB_URL"
              echo "PGHOST="
              echo "PGUSER="
              echo "PGPASSWORD="
              echo "PGPORT="
              echo "PGDATABASE="
            } >> "$GITHUB_ENV"
          else
            echo "::error::시크릿이 비어 있어요. 아래 둘 중 하나를 Repo Settings → Secrets and variables → Actions 에 등록해 주세요."
            echo "::error::"
            echo "::error::방법 A (권장):"
            echo "::error::  SUPABASE_DB_HOST      예) aws-0-ap-southeast-1.pooler.supabase.com"
            echo "::error::  SUPABASE_DB_USER      예) postgres.nsoesrvwkxqifjcxzvol"
            echo "::error::  SUPABASE_DB_PASSWORD  DB 비밀번호 날것"
            echo "::error::"
            echo "::error::방법 B:"
            echo "::error::  SUPABASE_DB_URL       Supabase Connect → Session pooler URI 통째"
            exit 1
          fi

      - name: 0) 연결 확인
        run: psql ${PSQL_CONN:+"$PSQL_CONN"} -c "select now() as server_time;"

      - name: 1) 0008 마이그레이션 적용 여부 확인 + 필요시 적용
        run: |
          set -e
          HAS_COL=$(psql ${PSQL_CONN:+"$PSQL_CONN"} -tA -c "select count(*) from information_schema.columns where table_schema='public' and table_name='tracks' and column_name='main_genre';")
          echo "main_genre column count: $HAS_COL"
          if [ "$HAS_COL" != "1" ]; then
            echo "→ 0008_recommendation_metadata.sql 적용 중…"
            psql ${PSQL_CONN:+"$PSQL_CONN"} -v ON_ERROR_STOP=1 -f supabase/migrations/0008_recommendation_metadata.sql
          else
            echo "→ 이미 적용되어 있음. 건너뜀."
          fi

      - name: 1b) 0009 (audio_url 가드) 마이그레이션 적용 — 멱등
        run: |
          set -e
          echo "→ 0009_filter_unplayable_tracks.sql 적용 중 (CREATE OR REPLACE 라 멱등)…"
          psql ${PSQL_CONN:+"$PSQL_CONN"} -v ON_ERROR_STOP=1 -f supabase/migrations/0009_filter_unplayable_tracks.sql

      - name: 1c) 0010 (storage bucket public) 마이그레이션 적용 — 멱등
        run: |
          set -e
          echo "→ 0010_storage_buckets_public.sql 적용 중 (storage.buckets 권한 부족 시 warning 후 통과)…"
          psql ${PSQL_CONN:+"$PSQL_CONN"} -v ON_ERROR_STOP=1 -f supabase/migrations/0010_storage_buckets_public.sql

      - name: 1d) 0011 (personal library — full-state continue_listening) 마이그레이션 적용
        run: |
          set -e
          # continue_listening 의 queue jsonb 컬럼 존재 여부로 적용 판단
          HAS_QUEUE=$(psql ${PSQL_CONN:+"$PSQL_CONN"} -tA -c "select count(*) from information_schema.columns where table_schema='public' and table_name='continue_listening' and column_name='queue';")
          echo "continue_listening.queue column count: $HAS_QUEUE"
          if [ "$HAS_QUEUE" != "1" ]; then
            echo "→ 0011_personal_library.sql 적용 중…"
            psql ${PSQL_CONN:+"$PSQL_CONN"} -v ON_ERROR_STOP=1 -f supabase/migrations/0011_personal_library.sql
          else
            echo "→ 이미 적용되어 있음. 건너뜀."
          fi

      - name: 1e) 0012 (playlist follow) 마이그레이션 적용
        run: |
          set -e
          HAS_FOLLOW=$(psql ${PSQL_CONN:+"$PSQL_CONN"} -tA -c "select count(*) from information_schema.tables where table_schema='public' and table_name='playlist_follows';")
          echo "playlist_follows table count: $HAS_FOLLOW"
          if [ "$HAS_FOLLOW" != "1" ]; then
            echo "→ 0012_playlist_follow.sql 적용 중…"
            psql ${PSQL_CONN:+"$PSQL_CONN"} -v ON_ERROR_STOP=1 -f supabase/migrations/0012_playlist_follow.sql
          else
            # RPC 들은 CREATE OR REPLACE 라 멱등 — 매번 갱신해도 안전
            echo "→ 테이블 이미 존재. RPC 만 재정의…"
            psql ${PSQL_CONN:+"$PSQL_CONN"} -v ON_ERROR_STOP=1 -f supabase/migrations/0012_playlist_follow.sql
          fi

      - name: 1f) 0013 (curator profiles) 마이그레이션 적용
        run: |
          set -e
          HAS_CURATOR=$(psql ${PSQL_CONN:+"$PSQL_CONN"} -tA -c "select count(*) from information_schema.tables where table_schema='public' and table_name='curator_profiles';")
          echo "curator_profiles table count: $HAS_CURATOR"
          # 멱등 — playlists.created_by_user_id 도 IF NOT EXISTS, 테이블/RPC 도 IF NOT EXISTS / CREATE OR REPLACE
          psql ${PSQL_CONN:+"$PSQL_CONN"} -v ON_ERROR_STOP=1 -f supabase/migrations/0013_curator_profiles.sql

      - name: 1g) 0014 (signup profiles — 본인/사업자 인증) 마이그레이션 적용
        run: |
          set -e
          # users.account_type 컬럼 존재 여부로 적용 판단
          HAS_AT=$(psql ${PSQL_CONN:+"$PSQL_CONN"} -tA -c "select count(*) from information_schema.columns where table_schema='public' and table_name='users' and column_name='account_type';")
          echo "users.account_type column count: $HAS_AT"
          # 멱등 (ADD COLUMN IF NOT EXISTS / CREATE TABLE IF NOT EXISTS / CREATE OR REPLACE)
          psql ${PSQL_CONN:+"$PSQL_CONN"} -v ON_ERROR_STOP=1 -f supabase/migrations/0014_signup_profiles.sql

      - name: 1h) 0015 (PayApp 정기결제) 마이그레이션 적용
        run: |
          set -e
          HAS_SUBS=$(psql ${PSQL_CONN:+"$PSQL_CONN"} -tA -c "select count(*) from information_schema.tables where table_schema='public' and table_name='subscriptions';")
          echo "subscriptions table count: $HAS_SUBS"
          # 멱등 (모든 객체 IF NOT EXISTS / ON CONFLICT)
          psql ${PSQL_CONN:+"$PSQL_CONN"} -v ON_ERROR_STOP=1 -f supabase/migrations/0015_payapp_subscriptions.sql

      - name: 1i) 0016 (PayApp 중복 방지 인덱스) 마이그레이션 적용
        run: |
          set -e
          # partial unique index — 같은 mul_no 가 두 order 에 들어가는 케이스 차단
          psql ${PSQL_CONN:+"$PSQL_CONN"} -v ON_ERROR_STOP=1 -f supabase/migrations/0016_payapp_uniqueness_hardening.sql

      - name: 1j) 0017 (아티스트 회원가입 + 음원 검수) 마이그레이션 적용
        run: |
          set -e
          # artist_profiles 테이블 + users.artist_approval_status + tracks 컬럼
          psql ${PSQL_CONN:+"$PSQL_CONN"} -v ON_ERROR_STOP=1 -f supabase/migrations/0017_artist_signup.sql

      - name: 1k) 0018 (아티스트 업로드 RLS + 검수 RPC) 마이그레이션 적용
        run: |
          set -e
          # tracks.rejected_reason + 아티스트 INSERT/UPDATE/DELETE RLS + 4개 RPC
          psql ${PSQL_CONN:+"$PSQL_CONN"} -v ON_ERROR_STOP=1 -f supabase/migrations/0018_artist_track_review.sql

      - name: 1l) 0019 (아티스트 스트리밍 분석 RPC) 마이그레이션 적용
        run: |
          set -e
          # get_artist_daily_streams + get_artist_streaming_summary (CREATE OR REPLACE 멱등)
          psql ${PSQL_CONN:+"$PSQL_CONN"} -v ON_ERROR_STOP=1 -f supabase/migrations/0019_artist_streaming_analytics.sql

      - name: 1m) 0020 (아티스트 스트리밍 KST 기준) 마이그레이션 적용
        run: |
          set -e
          # 두 RPC 의 일자 / today 경계를 Asia/Seoul 기준으로 재정의 (CREATE OR REPLACE)
          psql ${PSQL_CONN:+"$PSQL_CONN"} -v ON_ERROR_STOP=1 -f supabase/migrations/0020_artist_streaming_kst.sql

      - name: 1n) 0021 (handle_new_user 트리거가 user_metadata 읽어 자동 생성) 적용
        run: |
          set -e
          # 회원가입 시 account_type / artist_profiles 자동 생성 (CREATE OR REPLACE 멱등)
          psql ${PSQL_CONN:+"$PSQL_CONN"} -v ON_ERROR_STOP=1 -f supabase/migrations/0021_signup_metadata_trigger.sql

      - name: 1o) 0022 (signup_debug_events + 트리거 가시화) 적용 + 자체 검증
        run: |
          set -e
          echo "== 0022 적용 =="
          psql ${PSQL_CONN:+"$PSQL_CONN"} -v ON_ERROR_STOP=1 -f supabase/migrations/0022_signup_trigger_debug.sql
          echo ""
          echo "== 적용 후 검증 (함수 본문 + 트리거 + 디버그 테이블) =="
          psql ${PSQL_CONN:+"$PSQL_CONN"} -tA <<'SQL'
            select
              'fn_body_artist_profiles=' ||
              (case when (select pg_get_functiondef(p.oid) ilike '%artist_profiles%'
                          from pg_proc p join pg_namespace n on n.oid=p.pronamespace
                          where n.nspname='public' and p.proname='handle_new_user')
                    then 'YES' else 'NO' end);
            select
              'trigger_enabled=' ||
              (case when exists (
                  select 1 from pg_trigger
                  where tgname='on_auth_user_created'
                    and tgrelid='auth.users'::regclass
                    and tgenabled in ('O','A')
                ) then 'YES' else 'NO' end);
            select
              'debug_table_exists=' ||
              (case when exists (
                  select 1 from information_schema.tables
                  where table_schema='public' and table_name='signup_debug_events'
                ) then 'YES' else 'NO' end);
          SQL

      - name: 1p) 0023 (기존 아티스트 가입자 백필 RPC + 초기 1회 실행)
        run: |
          set -e
          echo "== 0023 적용 (initial backfill 자동 실행 포함 — 0022 의 signup_debug_events 도 함께 기록) =="
          psql ${PSQL_CONN:+"$PSQL_CONN"} -v ON_ERROR_STOP=1 -f supabase/migrations/0023_backfill_artist_signups.sql
          echo ""
          echo "== 백필 후 상태 =="
          psql ${PSQL_CONN:+"$PSQL_CONN"} -tA <<'SQL'
            select 'artist_users_total=' ||
              (select count(*)::text from public.users where account_type = 'artist');
            select 'artist_profiles_total=' ||
              (select count(*)::text from public.artist_profiles);
            select 'pending_artists=' ||
              (select count(*)::text from public.artist_profiles where approval_status='pending');
          SQL

      - name: 1q) 0024 (submit_artist_signup_profile RPC) 적용
        run: |
          set -e
          echo "== 0024 적용 =="
          psql ${PSQL_CONN:+"$PSQL_CONN"} -v ON_ERROR_STOP=1 -f supabase/migrations/0024_submit_artist_signup_rpc.sql
          echo ""
          echo "== RPC 존재 확인 =="
          psql ${PSQL_CONN:+"$PSQL_CONN"} -tA <<'SQL'
            select 'submit_rpc_exists=' ||
              (case when exists (
                select 1 from pg_proc p join pg_namespace n on n.oid=p.pronamespace
                where n.nspname='public' and p.proname='submit_artist_signup_profile'
              ) then 'YES' else 'NO' end);
          SQL

      - name: 1r) 0025 (아티스트 업로드 자격 5단계 게이트 + 정산 계좌) 적용
        run: |
          set -e
          echo "== 0025 적용 =="
          psql ${PSQL_CONN:+"$PSQL_CONN"} -v ON_ERROR_STOP=1 -f supabase/migrations/0025_artist_upload_eligibility.sql
          echo ""
          echo "== 적용 검증 (테이블/컬럼/RPC 존재 + RLS 강화 여부) =="
          psql ${PSQL_CONN:+"$PSQL_CONN"} -tA <<'SQL'
            select 'payout_table=' ||
              (case when exists (select 1 from information_schema.tables
                where table_schema='public' and table_name='artist_payout_accounts')
                then 'YES' else 'NO' end);
            select 'tracks_album_name=' ||
              (case when exists (select 1 from information_schema.columns
                where table_schema='public' and table_name='tracks' and column_name='album_name')
                then 'YES' else 'NO' end);
            select 'tracks_payout_account_id=' ||
              (case when exists (select 1 from information_schema.columns
                where table_schema='public' and table_name='tracks' and column_name='payout_account_id')
                then 'YES' else 'NO' end);
            select 'eligibility_rpc=' ||
              (case when exists (select 1 from pg_proc p join pg_namespace n on n.oid=p.pronamespace
                where n.nspname='public' and p.proname='get_artist_upload_eligibility')
                then 'YES' else 'NO' end);
            select 'submit_payout_rpc=' ||
              (case when exists (select 1 from pg_proc p join pg_namespace n on n.oid=p.pronamespace
                where n.nspname='public' and p.proname='submit_artist_payout_account')
                then 'YES' else 'NO' end);
            select 'list_pending_review_extended=' ||
              (case when (select pg_get_functiondef(p.oid) ilike '%album_name%'
                          from pg_proc p join pg_namespace n on n.oid=p.pronamespace
                          where n.nspname='public' and p.proname='list_pending_review_tracks')
                    then 'YES' else 'NO' end);
          SQL

      - name: 1s) 0026 (관리자 수동 결제 동기화 + 상품명 변경) 적용
        run: |
          set -e
          echo "== 0026 적용 (subscription_plans 이름 변경 + manual_payment_imports + sync RPC) =="
          psql ${PSQL_CONN:+"$PSQL_CONN"} -v ON_ERROR_STOP=1 -f supabase/migrations/0026_admin_payment_sync.sql
          echo ""
          echo "== 검증 =="
          psql ${PSQL_CONN:+"$PSQL_CONN"} -tA <<'SQL'
            select 'plan_individual_renamed=' ||
              (case when exists (select 1 from public.subscription_plans
                where plan_type='individual' and name='SRR Playlist 정기이용권')
                then 'YES' else 'NO' end);
            select 'plan_business_renamed=' ||
              (case when exists (select 1 from public.subscription_plans
                where plan_type='business' and name='SRR Playlist 사업자 정기이용권')
                then 'YES' else 'NO' end);
            select 'manual_imports_table=' ||
              (case when exists (select 1 from information_schema.tables
                where table_schema='public' and table_name='payapp_manual_payment_imports')
                then 'YES' else 'NO' end);
            select 'sync_rpc=' ||
              (case when exists (select 1 from pg_proc p join pg_namespace n on n.oid=p.pronamespace
                where n.nspname='public' and p.proname='admin_sync_payapp_payment')
                then 'YES' else 'NO' end);
          SQL

      - name: 1t) 0027 (관리자 미매칭 결제 수동 연결 RPC) 적용
        run: |
          set -e
          echo "== 0027 적용 (admin_link_unmatched_import + admin_search_users_for_link) =="
          psql ${PSQL_CONN:+"$PSQL_CONN"} -v ON_ERROR_STOP=1 -f supabase/migrations/0027_admin_link_unmatched.sql
          echo ""
          echo "== 검증 =="
          psql ${PSQL_CONN:+"$PSQL_CONN"} -tA <<'SQL'
            select 'link_rpc=' ||
              (case when exists (select 1 from pg_proc p join pg_namespace n on n.oid=p.pronamespace
                where n.nspname='public' and p.proname='admin_link_unmatched_import')
                then 'YES' else 'NO' end);
            select 'search_rpc=' ||
              (case when exists (select 1 from pg_proc p join pg_namespace n on n.oid=p.pronamespace
                where n.nspname='public' and p.proname='admin_search_users_for_link')
                then 'YES' else 'NO' end);
          SQL

      - name: 1u) 0028 (PayApp 진단 테이블 + phone 매칭 + webhook 조회 RPC) 적용
        run: |
          set -e
          echo "== 0028 적용 =="
          psql ${PSQL_CONN:+"$PSQL_CONN"} -v ON_ERROR_STOP=1 -f supabase/migrations/0028_payapp_diagnostics.sql
          echo ""
          echo "== 검증 =="
          psql ${PSQL_CONN:+"$PSQL_CONN"} -tA <<'SQL'
            select 'sync_attempts_table=' ||
              (case when exists (select 1 from information_schema.tables
                where table_schema='public' and table_name='payapp_api_sync_attempts')
                then 'YES' else 'NO' end);
            select 'list_webhook_events_rpc=' ||
              (case when exists (select 1 from pg_proc p join pg_namespace n on n.oid=p.pronamespace
                where n.nspname='public' and p.proname='list_recent_webhook_events')
                then 'YES' else 'NO' end);
            select 'list_sync_attempts_rpc=' ||
              (case when exists (select 1 from pg_proc p join pg_namespace n on n.oid=p.pronamespace
                where n.nspname='public' and p.proname='list_recent_sync_attempts')
                then 'YES' else 'NO' end);
            select 'phone_match_present=' ||
              (case when (select pg_get_functiondef(p.oid) ilike '%public.users u%regexp_replace%phone%'
                          from pg_proc p join pg_namespace n on n.oid=p.pronamespace
                          where n.nspname='public' and p.proname='admin_sync_payapp_payment')
                    then 'YES' else 'NO' end);
          SQL

      - name: 1v) 0029 (webhook 진단 컬럼 + _internal apply + replay RPC) 적용
        run: |
          set -e
          echo "== 0029 적용 =="
          psql ${PSQL_CONN:+"$PSQL_CONN"} -v ON_ERROR_STOP=1 -f supabase/migrations/0029_webhook_apply_internal.sql

      - name: 1w) 0030 (phone candidate 확장 + artist_profiles 매칭 + non-null error) 적용
        run: |
          set -e
          echo "== 0030 적용 =="
          psql ${PSQL_CONN:+"$PSQL_CONN"} -v ON_ERROR_STOP=1 -f supabase/migrations/0030_webhook_phone_match_fix.sql
          echo ""
          echo "== 검증 =="
          psql ${PSQL_CONN:+"$PSQL_CONN"} -tA <<'SQL'
            select 'internal_explicit_regex=' ||
              (case when (select pg_get_functiondef(p.oid) ilike '%[^0-9]%'
                          from pg_proc p join pg_namespace n on n.oid=p.pronamespace
                          where n.nspname='public' and p.proname='_internal_apply_payapp_paid_event')
                    then 'YES' else 'NO' end);
            select 'replay_phone_keys_expanded=' ||
              (case when (select pg_get_functiondef(p.oid) ilike '%cellphone%'
                          from pg_proc p join pg_namespace n on n.oid=p.pronamespace
                          where n.nspname='public' and p.proname='admin_replay_webhook_event')
                    then 'YES' else 'NO' end);
          SQL
          echo ""
          echo "== 검증 =="
          psql ${PSQL_CONN:+"$PSQL_CONN"} -tA <<'SQL'
            select 'event_matched_user_col=' ||
              (case when exists (select 1 from information_schema.columns
                where table_schema='public' and table_name='payapp_webhook_events' and column_name='matched_user_id')
                then 'YES' else 'NO' end);
            select 'internal_apply_rpc=' ||
              (case when exists (select 1 from pg_proc p join pg_namespace n on n.oid=p.pronamespace
                where n.nspname='public' and p.proname='_internal_apply_payapp_paid_event')
                then 'YES' else 'NO' end);
            select 'replay_event_rpc=' ||
              (case when exists (select 1 from pg_proc p join pg_namespace n on n.oid=p.pronamespace
                where n.nspname='public' and p.proname='admin_replay_webhook_event')
                then 'YES' else 'NO' end);
            select 'replay_by_mul_no_rpc=' ||
