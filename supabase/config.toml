# supabase/config.toml — Supabase CLI 프로젝트 메타
# 실행: supabase link --project-ref <ref> --password '<db-password>'
#       supabase db push          (migrations/ 적용)
#       supabase db seed --file supabase/seed.sql  (선택)

project_id = "srr-playlist"

[db]
major_version = 17

[api]
schemas = ["public", "storage", "graphql_public"]

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.buckets.audio]
public = true
file_size_limit = "50MiB"
allowed_mime_types = ["audio/*"]

[storage.buckets.covers]
public = true
file_size_limit = "5MiB"
allowed_mime_types = ["image/*"]

[auth]
enabled = true
# 운영 도메인 — Supabase 대시보드의 Authentication → URL Configuration 에서도 동일하게 설정해야 함.
site_url = "https://deudda.com"
additional_redirect_urls = [
  "https://deudda.com",
  "https://www.deudda.com",
  "http://localhost:5173",
]

[auth.email]
enable_signup = true
double_confirm_changes = true
# 회원가입/이메일 변경 시 인증 메일 발송 필수.
# false 면 가입 즉시 auto-confirm 되어 메일 미발송 + 즉시 로그인됨.
enable_confirmations = true

# 브랜드 인증메일 (듣다 DEUDDA) — supabase config push 로 적용.
# 대시보드(Authentication → Email Templates)에 동일 HTML 을 붙여넣어도 됨.
[auth.email.template.confirmation]
subject = "[듣다] 회원가입을 완료해주세요"
content_path = "./supabase/templates/confirm_signup.html"

[auth.email.template.magic_link]
subject = "[듣다] 로그인 링크를 보내드려요"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.recovery]
subject = "[듣다] 비밀번호 재설정 안내"
content_path = "./supabase/templates/reset_password.html"

[auth.email.template.email_change]
subject = "[듣다] 이메일 변경을 확인해주세요"
content_path = "./supabase/templates/change_email.html"
