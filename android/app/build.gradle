apply plugin: 'com.android.application'

// 릴리스 서명 — android/keystore.properties 가 있을 때만 켜진다.
//
// 키(.jks)도 비밀번호도 저장소에 들어가지 않는다(.gitignore). 파일이 없으면
// 서명 설정 자체가 붙지 않으므로, 키가 없는 사람도 debug 빌드는 그대로 된다.
// 만드는 법: npm run keystore
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def hasReleaseKey = keystorePropsFile.exists() && keystoreProps['storeFile']

// 버전 단일 진실 원천 = package.json. (아래 defaultConfig 에서 사용)
def deuddaPkg = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json'))
def deuddaVersionName = deuddaPkg.version
def deuddaVersionParts = deuddaVersionName.tokenize('.').collect { it.toInteger() }
if (deuddaVersionParts.size() != 3) {
    throw new GradleException("package.json 의 version 은 x.y.z 형식이어야 합니다: ${deuddaVersionName}")
}
if (deuddaVersionParts[1] > 99 || deuddaVersionParts[2] > 99) {
    throw new GradleException("minor/patch 는 99 를 넘을 수 없습니다(versionCode 가 역전됩니다): ${deuddaVersionName}")
}
def deuddaVersionCode = deuddaVersionParts[0] * 10000 + deuddaVersionParts[1] * 100 + deuddaVersionParts[2]

android {
    namespace "com.deudda.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.deudda.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // 버전은 package.json 하나만 고친다 — 안드로이드/iOS/웹이 따로 놀면
        // "폰에 깔린 게 어느 빌드인지" 를 아무도 모르게 된다.
        //
        // versionCode 는 Play 가 앱을 구분하는 정수이고 한 번 쓴 값은 다시 못 쓴다.
        // major*10000 + minor*100 + patch 로 만들어 항상 증가하게 한다
        // (1.0.0 → 10000, 1.0.1 → 10001, 1.2.0 → 10200). minor/patch 는 99 까지.
        versionCode deuddaVersionCode
        versionName deuddaVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseKey) {
                // storeFile 은 절대경로도 되고, android/ 기준 상대경로도 된다.
                def declared = new File(keystoreProps['storeFile'])
                storeFile declared.isAbsolute() ? declared : rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // 키가 없으면 서명을 붙이지 않는다. 그래야 "키 없음" 이 빌드 실패로 드러난다
            // — 서명 안 된 APK 가 조용히 나와서 기기에서 설치가 거부되는 것보다 낫다.
            if (hasReleaseKey) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
